services:
  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: llm-rig-llama:sm120
    command: ["-m", "/models/model.gguf", "-c", "${CONTEXT_LENGTH:-262144}", "-ngl", "99", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--host", "0.0.0.0", "--port", "8080", "--api-key", "${LLM_API_KEY}"]
    ports:
      - "127.0.0.1:${LLM_PORT:-8080}:8080"
    volumes:
      - ${RAM_DIR:-/mnt/ram}/models:/models:ro
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
    gpus: all

  proxy:
    build:
      context: ./proxy
    image: llm-rig-proxy
    ports:
      - "127.0.0.1:${PROXY_PORT:-8000}:8000"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      PROXY_API_KEY: ${PROXY_API_KEY}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      EXA_MONTHLY_LIMIT: ${EXA_MONTHLY_LIMIT:-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      SEARCH_DAILY_CAP: ${SEARCH_DAILY_CAP:-0}
      PORT: "8000"
      USAGE_FILE: /data/usage.json
    volumes:
      - ${RAM_DIR:-/mnt/ram}/data:/data
